# Fix a GitHub issue with an AI agent (with configurable agent template)
# This workflow runs an AI agent to address an issue and optionally creates a PR
# with the changes. Unlike fix-issue.yml, this version supports applying an agent
# configuration from a separate repository via a justfile install recipe.
#
# Required secrets: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
# Optional secrets: GH_PAT (for private cross-repo access)
#
# ============================================================================
# WORKFLOW STRATEGY: Direct Issue Resolution with Configurable Agent
# ============================================================================
# This workflow addresses an issue directly without evaluation, but allows
# customizing the agent's behavior via an external configuration:
#
# 1. Checkout the repository at the default branch
# 2. Checkout agent configuration from a separate repo
# 3. Run `just install` from the agent config to set up CLAUDE.md, etc.
# 4. Run Claude Code agent on the issue
# 5. Agent commits changes (if any)
# 6. Optionally create a PR with the changes
#
# The agent_config_repo should contain a justfile with an "install" recipe
# that configures the repo for the agent (e.g., copies CLAUDE.md, adds configs).
#
# ============================================================================
# USAGE EXAMPLES (gh CLI)
# ============================================================================
#
# Basic usage - fix issue #42 using agent config from same repo:
#
#   gh workflow run fix-issue-configurable.yml \
#     -f issue_number=42 \
#     -f agent_config_tag=v1.0.0 \
#     -f model=claude-sonnet-4-5-20250929
#
# Using agent config from a different repo:
#
#   gh workflow run fix-issue-configurable.yml \
#     -f issue_number=42 \
#     -f agent_config_repo=obophenotype/ontology-agent \
#     -f agent_config_tag=v1.0.0 \
#     -f agent_config_directory=uberon-config \
#     -f model=claude-sonnet-4-5-20250929
#
# Shadow repo use case - fix issue from another repo:
#
#   gh workflow run fix-issue-configurable.yml \
#     -f issue_repo=monarch-initiative/mondo \
#     -f issue_number=8116 \
#     -f agent_config_repo=obophenotype/ontology-agent \
#     -f agent_config_tag=v1.0.0 \
#     -f model=claude-sonnet-4-5-20250929
#
# With validation and custom container:
#
#   gh workflow run fix-issue-configurable.yml \
#     -f issue_number=42 \
#     -f agent_config_tag=v1.0.0 \
#     -f model=claude-sonnet-4-5-20250929 \
#     -f container=obolibrary/odkfull:latest \
#     -f validation_command="make test"
#
# Skip PR creation (just create the branch):
#
#   gh workflow run fix-issue-configurable.yml \
#     -f issue_number=42 \
#     -f agent_config_tag=v1.0.0 \
#     -f model=claude-sonnet-4-5-20250929 \
#     -f create_pr=false
#
# ============================================================================
name: Fix an issue with configurable AI agent
run-name: "fix-agent: ${{ inputs.issue_repo || github.repository }}#${{ inputs.issue_number }}; model: ${{ inputs.model }}; agent config: ${{ inputs.agent_config_repo || github.repository }}@${{ inputs.agent_config_tag }}:${{ inputs.agent_config_directory }}"

on:
  workflow_dispatch:
    inputs:
      issue_repo:
        description: "The repository containing the issue (owner/repo). Defaults to current repository. Use this when running in a shadow repo that imports issues from another repo."
        required: false
      issue_number:
        description: "The issue number to fix. This should be an issue in issue_repo."
        required: true
      # agent template, e.g. obophenotype/uberon-agent + v1.0.0 + subagent-template
      agent_config_repo:
        description: "The repository containing the agent configuration (owner/repo). Defaults to current repository.
          Example: obophenotype/uberon-agent. Storing config in a separate repo is recommended."
        required: false
      agent_config_tag:
        description: "The version/tag of the agent config repo to use. Avoid 'latest' for reproducibility."
        required: true
      agent_config_directory:
        description: "The directory within agent_config_repo containing the justfile. Defaults to ."
        required: false
        default: "."
      model:
        description: "Claude model to use"
        required: true
        type: choice
        options:
          # Current models (4.5)
          - claude-sonnet-4-5-20250929
          - claude-haiku-4-5-20251001
          - claude-opus-4-5-20251101
          # Legacy models (4.x)
          - claude-opus-4-1-20250805
          - claude-sonnet-4-20250514
          - claude-opus-4-20250514
          # Legacy models (3.x)
          - claude-3-7-sonnet-20250219
          - claude-3-haiku-20240307
      create_pr:
        description: "Whether to create a PR with the changes. Defaults to true."
        required: false
        default: "true"
      target_branch:
        description: "Target branch for PR. Defaults to main. Use a feature branch name for draft PRs."
        required: false
        default: "main"
      repo_url_prefix:
        description: "URL prefix for issue links. Defaults to https://href.li/? for indirect links. Set to empty string for direct GitHub links."
        required: false
        default: "https://href.li/?"
      container:
        description: "Optional container image to run in. Leave empty for host runner."
        required: false
        default: ""
      uv_tool_install:
        description: "Optional list of pypi tools to install using uv (space-separated)."
        required: false
        default: ""
      validation_command:
        description: "Optional command to validate agent changes (e.g., 'make test'). Job fails if validation fails."
        required: false
        default: ""
      artifact_retention_days:
        description: "Number of days to retain workflow artifacts"
        required: false
        default: "90"
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        default: "30"

env:
  AGENT_VERSION: v1

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    container: ${{ inputs.container || null }}
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Set agent config name
        run: |
          # Sanitize inputs for branch name
          REPO_PART=$(echo "${{ inputs.agent_config_repo || github.repository }}" | tr '/' '-')
          DIR_PART=$(echo "${{ inputs.agent_config_directory }}" | tr '/' '-')
          MODEL_PART=$(echo "${{ inputs.model }}" | tr '/' '-')

          # Build branch name, handling "." directory specially
          if [ "$DIR_PART" = "." ]; then
            AGENT_BRANCH_NAME="fix-agent-issue-${{ inputs.issue_number }}-${MODEL_PART}-${REPO_PART}"
          else
            AGENT_BRANCH_NAME="fix-agent-issue-${{ inputs.issue_number }}-${MODEL_PART}-${REPO_PART}-${DIR_PART}"
          fi
          # Remove any trailing periods or dashes (illegal in git branch names)
          AGENT_BRANCH_NAME=$(echo "$AGENT_BRANCH_NAME" | sed 's/[.-]*$//')
          echo "agent_branch_name=${AGENT_BRANCH_NAME}" >> $GITHUB_ENV

          echo "model_short=$(echo "${{ inputs.model }}" | sed -E 's/claude-([a-z]+)-([0-9]+)-([0-9]+).*/\1-\2.\3/')" >> $GITHUB_ENV
          # Config: use directory basename (most distinguishing part), handle "." -> "root"
          CONFIG_SHORT=$(basename "${{ inputs.agent_config_directory }}")
          [ "$CONFIG_SHORT" = "." ] && CONFIG_SHORT="root"
          echo "config_short=${CONFIG_SHORT}" >> $GITHUB_ENV

      - name: Checkout repository at default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install copier
        run: |
          uv tool install copier

      # Note: uv tool install takes a single argument, so we need to split the list of tools on spaces;
      # Only run if uv_tool_install is not empty
      - name: Install additional tools
        if: ${{ inputs.uv_tool_install != '' }}
        run: |
          uv tool install $(echo "${{ inputs.uv_tool_install }}" | tr ' ' '\n')

      - name: Checkout agent template repository in __agent_config__ directory
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agent_config_repo || github.repository }}
          ref: ${{ inputs.agent_config_tag }}
          path: ./__agent_config__
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # Apply the agent template to this repo. The template's justfile should have an "install" recipe
      # that configures the repo for the agent (e.g., copies CLAUDE.md, removes files, runs copier).
      - name: Install agent configuration
        run: |
          just -f __agent_config__/${{ inputs.agent_config_directory }}/justfile install
          ls *.md

      - name: Gather issue context
        id: issue_context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Fetch issue details and all comments from the issue repo
          ISSUE_REPO="${{ inputs.issue_repo || github.repository }}"
          gh -R "${ISSUE_REPO}" issue view ${{ inputs.issue_number }} --json url,title,body,comments > __issue_context__.json

          # Extract issue title and URL
          ISSUE_TITLE=$(jq -r '.title' __issue_context__.json)
          ISSUE_URL=$(jq -r '.url' __issue_context__.json)
          echo "issue_title=${ISSUE_TITLE}" >> $GITHUB_OUTPUT
          echo "issue_url=${ISSUE_URL}" >> $GITHUB_OUTPUT
          echo "Issue #${{ inputs.issue_number }}: ${ISSUE_TITLE} (from ${ISSUE_REPO})"

      - name: Create fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and checkout fix branch
          git checkout -b "${{ env.agent_branch_name }}"
          echo "✓ Created branch: ${{ env.agent_branch_name }}"

      - name: Run Claude Code
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: |
            Your job is to address issue #${{ inputs.issue_number }}.
            First, read the file __issue_context__.json in the current working directory to get the issue title, body, and comments.

            IMPORTANT: You are working in a local copy of ${{ github.repository }}.
            The issue context was imported from ${{ inputs.issue_repo || github.repository }}.
            Do NOT attempt to clone, checkout, or interact with any remote repositories.
            Stay in the current working directory and make all changes here.
            This is a direct issue fix, not an evaluation.
            On completion, commit your changes locally. Do NOT push - that will be handled automatically.
            Don't commit files you did not edit.

            After committing, create a file:
            SOLUTION_NOTES.md: Description of your changes and rationale

            I will take care of creating the PR and pushing to GitHub, you just need to create this file.
            Don't commit it, and don't attempt to push.

            If the original issue is not clear, ask for clarification in SOLUTION_NOTES.md, and do not
            commit any changes.

            Your SOLUTION_NOTES.md should be a human-readable description of your changes, the rationale,
            and any decisions you made. Include any checklists you created for yourself and completed.
            If you performed validation, background research, etc, be sure to mention this.

            Follow any CODE_OF_CONDUCT.md or other relevant files in the repository.

          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,LS,MultiEdit,NotebookEdit,TodoRead,TodoWrite,WebFetch,WebSearch"
          model: ${{ inputs.model }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Add signature to solution notes
        run: |
          # Metadata signature includes: model, agent config, and link to workflow run
          SIGNATURE="---
          🤖 **Generated by Claude Code Agent**
          - Model: \`${{ inputs.model }}\`
          - Agent config: \`${{ inputs.agent_config_repo || github.repository }}@${{ inputs.agent_config_tag }}:${{ inputs.agent_config_directory }}\`
          - Run: [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [ -f "SOLUTION_NOTES.md" ]; then
            echo "" >> SOLUTION_NOTES.md
            echo "$SIGNATURE" >> SOLUTION_NOTES.md
          fi

      # Run validation command if specified (e.g., make test)
      - name: Validate agent changes
        if: ${{ inputs.validation_command != '' }}
        run: |
          echo "Running validation: ${{ inputs.validation_command }}"
          echo "========================================"
          ${{ inputs.validation_command }}
          echo "========================================"
          echo "Validation passed"

      - name: Commit and push branch
        run: |
          # Create commit with metadata
          git commit --allow-empty -m "fix-agent: issue #${{ inputs.issue_number }} (${{ env.model_short }}, ${{ env.config_short }})

          Model: ${{ inputs.model }}
          Agent config: ${{ inputs.agent_config_repo || github.repository }}@${{ inputs.agent_config_tag }}:${{ inputs.agent_config_directory }}
          Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

          git push -u origin "${{ env.agent_branch_name }}"
          echo "✓ Pushed branch: ${{ env.agent_branch_name }}"

      - name: Create PR
        id: create_pr
        if: ${{ inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Apply repo_url_prefix to issue link
          # By default, links are prefixed with https://href.li/? to create indirect
          # redirects. This prevents GitHub's "reciprocal view" from cluttering the issue.
          ISSUE_URL="${{ inputs.repo_url_prefix }}${{ steps.issue_context.outputs.issue_url }}"

          # Get commit messages from agent's work
          COMMIT_LOG=$(git log --oneline origin/${{ inputs.target_branch }}.."${{ env.agent_branch_name }}" --pretty=format:"- %s" || echo "No commits from agent")
          echo "Agent commits:"
          echo "$COMMIT_LOG"

          # Read agent output file
          SOLUTION_NOTES=""
          if [ -f "SOLUTION_NOTES.md" ]; then
            SOLUTION_NOTES=$(cat SOLUTION_NOTES.md)
          fi

          # ========================================================================
          # Build PR body
          # ========================================================================
          PR_BODY="## Fixes
          [#${{ inputs.issue_number }}: ${{ steps.issue_context.outputs.issue_title }}](${ISSUE_URL})

          ## Agent Changes
          ${COMMIT_LOG}"

          if [ -n "$SOLUTION_NOTES" ]; then
            PR_BODY="${PR_BODY}

          ## Solution Details
          ${SOLUTION_NOTES}"
          fi

          # Add config and footer
          REPO_URL_PREFIX_DISPLAY="${{ inputs.repo_url_prefix }}"
          if [ -z "$REPO_URL_PREFIX_DISPLAY" ]; then
            REPO_URL_PREFIX_DISPLAY="(direct links - no prefix)"
          fi

          PR_BODY="${PR_BODY}

          ## Agent Config
          | Parameter | Value |
          |-----------|-------|
          | Model | \`${{ inputs.model }}\` |
          | Issue repo | \`${{ inputs.issue_repo || github.repository }}\` |
          | Agent config | \`${{ inputs.agent_config_repo || github.repository }}@${{ inputs.agent_config_tag }}:${{ inputs.agent_config_directory }}\` |
          | URL prefix | \`${REPO_URL_PREFIX_DISPLAY}\` |

          See workflow artifacts for full Claude trace."

          # Create the PR
          PR_URL=$(gh pr create \
            --base "${{ inputs.target_branch }}" \
            --head "${{ env.agent_branch_name }}" \
            --title "fix: issue #${{ inputs.issue_number }} - ${{ steps.issue_context.outputs.issue_title }} (${{ env.model_short }}, ${{ env.config_short }})" \
            --body "$PR_BODY" \
            --draft)

          # Extract PR number from URL
          CREATED_PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "created_pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "created_pr_number=${CREATED_PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "Created PR #${CREATED_PR_NUMBER}: ${PR_URL}"

      - name: Upload issue context
        uses: actions/upload-artifact@v4
        with:
          name: issue-context-${{ github.run_id }}
          path: __issue_context__.json
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload Claude output
        uses: actions/upload-artifact@v4
        with:
          name: claude-response-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload solution notes
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('SOLUTION_NOTES.md') != '' }}
        with:
          name: solution-notes-${{ github.run_id }}
          path: SOLUTION_NOTES.md
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Save run metadata
        run: |
          cat > /tmp/run-metadata.json << 'EOF'
          {
            "run_id": ${{ github.run_id }},
            "repo": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "inputs": {
              "issue_repo": "${{ inputs.issue_repo || github.repository }}",
              "issue_number": "${{ inputs.issue_number }}",
              "model": "${{ inputs.model }}",
              "agent_config_repo": "${{ inputs.agent_config_repo || github.repository }}",
              "agent_config_tag": "${{ inputs.agent_config_tag }}",
              "agent_config_directory": "${{ inputs.agent_config_directory }}",
              "target_branch": "${{ inputs.target_branch }}",
              "repo_url_prefix": "${{ inputs.repo_url_prefix }}",
              "create_pr": "${{ inputs.create_pr }}"
            },
            "branch": "${{ env.agent_branch_name }}",
            "created_pr_number": "${{ steps.create_pr.outputs.created_pr_number || '' }}",
            "created_pr_url": "${{ steps.create_pr.outputs.created_pr_url || '' }}",
            "issue_url": "${{ steps.issue_context.outputs.issue_url }}"
          }
          EOF

      - name: Upload run metadata
        uses: actions/upload-artifact@v4
        with:
          name: run-metadata-${{ github.run_id }}
          path: /tmp/run-metadata.json
          retention-days: ${{ inputs.artifact_retention_days }}
