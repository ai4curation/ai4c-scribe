[pytest]
pythonpath = src .
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
# Skip integration tests by default (they require gh CLI auth)
# Run with: pytest -m "" to include all tests
addopts = -m "not llm and not slow and not integration"
markers =
    llm: marks tests as LLM tests
    integration: marks tests as integration tests (require gh CLI, GitHub API)
    slow: marks tests as slow (e.g., require git clone)
