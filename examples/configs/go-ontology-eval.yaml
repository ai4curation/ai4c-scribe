# Eval config for go-ontology using case study files
# Usage:
#   uv run ai4c-scribe workflows run examples/configs/go-ontology-eval.yaml --dry-run

workflow: eval-agent-on-issue.yml
repo: cmungall/go-ontology-eval-2026
description: "Evaluate agents on curated go-ontology case studies"
tags: ["go-ontology", "case-studies"]

# Working directory for database and gh commands
workdir: ../go-ontology-eval-2026

# Load case studies from the examples directory (relative to this config file)
input_sets_dir: ../cases/go-ontology

# Optional: filter to only simple/medium cases for quick runs
# input_sets_filter:
#   difficulty: [simple, medium]

inputs:
  issue_repo: geneontology/go-ontology
  timeout_minutes: 90
  agent_config_repo: cmungall/go-ontology-agent-config
  agent_config_tag: v6
  agent_config_directory: .
  force_new_branch: "true"
  create_pr: "true"
  iter_num: 1
  model: [claude-opus-4-5-20251101, claude-sonnet-4-5-20250929]
  container: obolibrary/odkfull:latest

limits:
  max_concurrent: 10
  batch_size: 10
  poll_interval_seconds: 30
