site_name: "SCRIBE"
site_description: "Social Coding Repository artificial Intelligence Benchmarking and Evaluation - Extract training data and run agentic evals on GitHub repositories"

theme:
  name: material
  features:
    - content.tabs.link
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      allow_errors: false
  - mermaid2:
      version: 11.4.1

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
    - tutorials/index.md
    - Installation: tutorials/installation.md
    - Your first extraction: tutorials/first-extraction.md
    - Complete workflow: tutorials/full-workflow.md
    - Shadow repo evaluation: tutorials/shadow-repo-eval.md
  - How-to guides:
    - how-to/index.md
    - Extract PRs: how-to/extract-prs.md
    - Create review cases: how-to/create-review-cases.md
    - Distill vignettes: how-to/distill-vignettes.md
    - Evaluate an agent: how-to/evaluate-agent.md
    - Set up shadow repos: how-to/shadow-repos.md
    - Manage the cache: how-to/manage-cache.md
    - Filter PRs: how-to/filter-prs.md
  - Explanation:
    - explanation/index.md
    - Why SCRIBE?: explanation/why-scribe.md
    - PR categories: explanation/pr-categories.md
    - Data model: explanation/data-model.md
    - Review cases: explanation/review-cases.md
    - Shadow repos: explanation/shadow-repos.md
    - Distillation: explanation/distillation.md
  - Reference:
    - reference/index.md
    - CLI: reference/cli.md
    - GitHub workflows: reference/github-workflows.md
    - Data structures: reference/data-structures.md
    - Output format: reference/output-format.md
    - Python API: reference/python-api.md
  - Examples:
    - End-to-End Evaluation: examples/end_to_end_eval.ipynb
    - Python API: examples/python_api_example.ipynb

exclude_docs: |
  /templates-linkml/

site_url: https://ai4curation.github.io/ai4c-scribe
repo_url: https://github.com/ai4curation/ai4c-scribe
repo_name: ai4curation/ai4c-scribe

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai4curation/ai4c-scribe
