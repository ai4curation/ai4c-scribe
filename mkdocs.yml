site_name: "SCRIBE"
site_description: "Social Coding Repository artificial Intelligence Benchmarking and Evaluation - Extract training data and run agentic evals on GitHub repositories"

theme:
  name: material
  features:
    - content.tabs.link
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      allow_errors: false
  - mermaid2:
      version: 11.4.1

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - How-to guides:
    - how-to/index.md
    - Add a new repo: how-to/add-new-repo.md
    - Filter cases: how-to/filter-cases.md
  - Explanation:
    - explanation/index.md
    - Shadow repos: explanation/shadow-repos.md
  - Reference:
    - reference/index.md
    - Case study schema: reference/case-study-schema.md
    - CLI: reference/cli.md
    - Workflow: reference/workflow.md
    - Metadiff: reference/metadiff.md

exclude_docs: |
  /templates-linkml/

site_url: https://ai4curation.github.io/ai4c-scribe
repo_url: https://github.com/ai4curation/ai4c-scribe
repo_name: ai4curation/ai4c-scribe

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai4curation/ai4c-scribe
