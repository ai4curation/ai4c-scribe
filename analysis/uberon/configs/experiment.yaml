# Experiment specification for Uberon ontology evaluation
workflow: eval-agent-on-issue.yml
repo: ai4curation/eval-ont-agent-uberon
description: "Uberon anatomy ontology agent evaluation - harness comparison on gpt-5.5"
tags: ["uberon", "harness-comparison"]

input_sets_dir: ../cases

inputs:
  issue_repo: obophenotype/uberon
  timeout_minutes: 90
  agent_config_repo: ai4curation/uberon-agent-config
  agent_config_tag: v3
  agent_config_directory: .
  force_new_branch: "true"
  create_pr: "true"
  iter_num: 1
  container: obolibrary/odkfull:latest
  reasoning_effort: high

  agent_runtime: [codex, opencode, pi]
  model: [gpt-5.5]

limits:
  max_concurrent: 5
  batch_size: 10
  poll_interval_seconds: 30
