# Copilot CLI + Sonnet 4.5 evaluation on Uberon
workflow: eval-agent-on-issue.yml
repo: ai4curation/eval-ont-agent-uberon
description: "Uberon - Copilot CLI + Sonnet 4.5"
tags: ["uberon", "copilot"]

input_sets_dir: ../cases

inputs:
  issue_repo: obophenotype/uberon
  timeout_minutes: 90
  agent_config_repo: ai4curation/uberon-agent-config
  agent_config_tag: v3
  agent_config_directory: .
  force_new_branch: "true"
  create_pr: "true"
  iter_num: 1
  container: obolibrary/odkfull:latest

  agent_runtime: [copilot]
  model: [claude-sonnet-4.5]

limits:
  max_concurrent: 5
  batch_size: 10
  poll_interval_seconds: 30
