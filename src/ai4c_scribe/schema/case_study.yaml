id: https://w3id.org/ai4c-scribe/case-study
name: case_study
title: Case Study Schema
description: >-
  Schema for evaluation case study frontmatter. Each case study describes
  one issue/PR pair suitable for agent evaluation replay.

prefixes:
  linkml: https://w3id.org/linkml/
  ai4cs: https://w3id.org/ai4c-scribe/
  schema: http://schema.org/

imports:
  - linkml:types

default_range: string


classes:
  CaseStudy:
    description: >-
      A single issue/PR evaluation case. Represented as YAML frontmatter
      in a markdown file, with the markdown body containing an agentic
      narrative summary of the issue and its resolution.
    attributes:
      # === Identity (required by runner) ===
      repo:
        description: Repository in owner/name format
        required: true
        examples:
          - value: geneontology/go-ontology
          - value: monarch-initiative/mondo

      issue_number:
        description: GitHub issue number
        range: integer
        required: true

      pr_number:
        description: PR number of the human's actual fix
        range: integer
        required: true

      # === GitHub Metadata Snapshot ===
      issue_title:
        description: Issue title at time of curation
        required: true

      issue_labels:
        description: GitHub labels on the issue
        multivalued: true
        range: string

      issue_created_at:
        description: When the issue was created
        range: date
        required: true

      issue_closed_at:
        description: When the issue was closed
        range: date

      pr_author:
        description: PR author GitHub username
        required: true

      pr_merged_at:
        description: When the PR was merged
        range: date

      pr_num_commits:
        description: Number of commits in the PR
        range: integer

      milestone:
        description: GitHub milestone name

      # === PR File Changes ===
      files_changed:
        description: Files modified in the PR with line change counts
        multivalued: true
        range: FileChange
        inlined_as_list: true

      # === Scoping Assessment ===
      scoping:
        description: Assessment of how well-scoped the PR is
        range: ScopingEnum
        required: true

      scoping_notes:
        description: >-
          Brief explanation of scoping assessment. Note any unrelated changes,
          scope creep, or reasons the PR is not cleanly scoped.

      eval_suitability:
        description: >-
          Whether this case is suitable for fair agent evaluation. Orthogonal
          to difficulty — a case can be simple but unusable if the issue-to-PR
          mapping is misleading.
        range: EvalSuitabilityEnum

      eval_suitability_notes:
        description: >-
          Explanation of eval_suitability rating. Describe what makes the case
          flawed or unusable (e.g. wrong issue linked, contradictory instructions).

      diff_noise:
        description: >-
          Whether the gold-standard diff contains noise unrelated to the
          actual task (e.g. Protege serialization reordering, whitespace,
          tool-generated comment changes). Affects scoring fairness.
        range: DiffNoiseEnum

      diff_noise_notes:
        description: >-
          Description of what noise is present in the diff.

      # === Custom Tagging ===
      task_type:
        description: Primary task type for this case
        range: TaskTypeEnum
        required: true

      difficulty:
        description: Estimated difficulty level
        range: DifficultyEnum
        required: true

      scope:
        description: Scope of changes in the PR
        range: ScopeEnum
        required: true

      review_outcome:
        description: How the review process went
        range: ReviewOutcomeEnum
        required: true

      domain_area:
        description: Free-form domain area (e.g. cellular-component, infectious-disease)

      tags:
        description: Free-form additional tags for filtering
        multivalued: true
        range: string

      # === Curation Metadata ===
      curated_by:
        description: Who or what created this case study (agent model, human username)
        required: true

      curated_at:
        description: When this case study was curated
        range: date
        required: true

      rationale:
        description: One-liner explaining why this is a good test case
        required: true

      # === Quality Flagging (post-curation review) ===
      case_quality:
        description: Overall quality assessment for use as an eval case (good, ok, poor)
        range: string

      case_quality_reason:
        description: Free-form machine-readable reason code for the quality assessment
        range: string

      companion_prs:
        description: Other PR numbers that, together with the gold PR, fully resolve the issue
        multivalued: true
        range: integer

      scoring_caveat:
        description: Human-readable note on how to interpret metadiff scores for this case
        range: string

      quality_flagged_by:
        description: Who or what flagged the quality assessment (agent model or username)
        range: string

      quality_flagged_at:
        description: When the quality assessment was made
        range: date

      agent_coverage:
        description: Whether any agent eval attempts exist for this case (e.g. none, partial, full)
        range: string

      agent_coverage_note:
        description: Free-form note on agent eval coverage status
        range: string

      task_type_correction:
        description: Corrected task_type when the curated value is imprecise
        range: string

      task_type_note:
        description: Explanation of a task_type correction or imprecision
        range: string


  FileChange:
    description: >-
      A single file changed in the PR, with line counts.
    attributes:
      path:
        description: File path relative to repo root
        required: true
      additions:
        description: Number of lines added
        range: integer
        required: true
      deletions:
        description: Number of lines deleted
        range: integer
        required: true

enums:
  TaskTypeEnum:
    description: The primary type of work performed in the PR
    permissible_values:
      new_term:
        description: Adding a new ontology term
      obsoletion:
        description: Obsoleting an existing term
      reclassification:
        description: Moving a term in the hierarchy
      synonym_update:
        description: Adding or modifying synonyms
      axiom_repair:
        description: Fixing logical axioms or definitions
      bulk_edit:
        description: Batch changes across many terms
      documentation:
        description: Documentation or metadata-only changes
      other:
        description: Does not fit other categories

  DifficultyEnum:
    description: Estimated difficulty for an agent to reproduce the fix
    permissible_values:
      simple:
        description: Straightforward, mechanical change
      medium:
        description: Requires some domain knowledge or multi-step reasoning
      hard:
        description: Complex reasoning, multiple interacting changes, or deep domain expertise

  ScopeEnum:
    description: Scope of the changes in the PR
    permissible_values:
      single_term:
        description: Changes affect a single term
      multi_term:
        description: Changes affect multiple terms
      structural_refactor:
        description: Broad structural or organizational changes

  ReviewOutcomeEnum:
    description: How the PR review process went
    permissible_values:
      approved_first_time:
        description: PR approved without revision requests
      changes_requested:
        description: One round of changes requested before merge
      multiple_rounds:
        description: Multiple rounds of review feedback before merge

  EvalSuitabilityEnum:
    description: Whether this case is suitable for fair agent evaluation
    permissible_values:
      good:
        description: Issue clearly describes the task, PR directly addresses it, agent can reasonably produce comparable output
      flawed:
        description: Issue-to-PR mapping is imperfect (vague issue, PR does more/less than requested) but still somewhat evaluable
      unusable:
        description: Issue and PR are fundamentally disconnected; scoring against the gold PR is meaningless

  DiffNoiseEnum:
    description: Whether the gold-standard diff contains serialization noise
    permissible_values:
      clean:
        description: Diff contains only intentional changes
      minor_noise:
        description: Some tool-generated noise (reordering, whitespace) but core changes are clear
      noisy:
        description: Significant serialization artifacts that make character-level diff comparison unreliable

  ScopingEnum:
    description: How well-scoped the PR is relative to its issue
    permissible_values:
      tightly_scoped:
        description: All changes directly address the issue, no unrelated modifications
      mostly_scoped:
        description: Primary changes address the issue, minor incidental cleanup included
      loosely_scoped:
        description: Significant unrelated changes mixed in, harder to isolate the fix
